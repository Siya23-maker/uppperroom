  <script>
    // Hosting mode.
    // - Local dev server (npm start on localhost): clean URLs such as /shop.
    // - Anywhere else (e.g. GitHub Pages at /uppperroom/): routes after "#", e.g. /uppperroom/#/shop,
    //   so the homepage, refreshes and back/forward work without a server.
    // The <base> tag makes the relative asset paths below resolve from the site folder on every route.
    (function () {
      var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
      window.__UR_ROUTER_MODE = local ? 'history' : 'hash';
      var base = local ? '/' : location.pathname.replace(/[^/]*$/, '');
      document.write('<base href="' + base + '">');
    })();
  </script>
